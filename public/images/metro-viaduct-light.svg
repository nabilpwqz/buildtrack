<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-metro-viaduct-light" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="50%" stop-color="#EBE5DB" />
      <stop offset="100%" stop-color="#DFD8CC" />
    </linearGradient>
    <linearGradient id="glow-metro-viaduct-light" x1="200" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D99300" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-metro-viaduct-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D3CCC0" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Ground & Foundation -->
  <rect width="800" height="500" fill="url(#bg-metro-viaduct-light)" />
  <rect width="800" height="500" fill="url(#grid-metro-viaduct-light)" opacity="0.4" />
  <rect width="800" height="500" fill="url(#glow-metro-viaduct-light)" />

  <!-- Horizon Ground Line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#D3CCC0" stroke-width="2" />
  <line x1="0" y1="384" x2="800" y2="384" stroke="#D99300" stroke-width="1" opacity="0.5" />

  <!-- Structural Elements -->
  
  <!-- Pier Foundation Footings -->
  <rect x="100" y="370" width="80" height="15" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />
  <rect x="360" y="370" width="80" height="15" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />
  <rect x="620" y="370" width="80" height="15" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />

  <!-- Reinforced Concrete Piers & Cantilever Pier Caps -->
  <rect x="125" y="240" width="30" height="130" fill="#DFD8CC" stroke="#6E6862" stroke-width="2" />
  <polygon points="105,240 175,240 160,260 120,260" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />

  <rect x="385" y="240" width="30" height="130" fill="#DFD8CC" stroke="#6E6862" stroke-width="2" />
  <polygon points="365,240 435,240 420,260 380,260" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />

  <rect x="645" y="240" width="30" height="130" fill="#DFD8CC" stroke="#6E6862" stroke-width="2" />
  <polygon points="625,240 695,240 680,260 640,260" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />
  
  <!-- Continuous Box Girder Deck -->
  <polygon points="40,240 760,240 740,195 60,195" fill="#EBE5DB" stroke="#D99300" stroke-width="2" />
  <line x1="40" y1="205" x2="760" y2="205" stroke="#6E6862" stroke-width="1.5" stroke-dasharray="10 5" />
  <line x1="40" y1="225" x2="760" y2="225" stroke="#D3CCC0" stroke-width="1" />
  
  <!-- Parapet Guardrails & Twin Rail Tracks -->
  <line x1="40" y1="190" x2="760" y2="190" stroke="#3D3935" stroke-width="3" />
  <line x1="40" y1="184" x2="760" y2="184" stroke="#6E6862" stroke-width="1" stroke-dasharray="6 3" />

  <!-- Active Span Segment Highlighting (Span #04) -->
  <rect x="330" y="150" width="140" height="40" rx="2" fill="#D99300" fill-opacity="0.12" stroke="#D99300" stroke-width="1.8" />
  <text x="400" y="166" fill="#D99300" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">ELEVATED VIADUCT</text>
  <text x="400" y="181" fill="#D94F05" font-family="monospace" font-size="11" font-weight="extrabold" text-anchor="middle">SPAN #04 ACTIVE</text>

  <!-- Telemetry HUD Badge Overlay (Top-Left) -->
  <rect x="40" y="40" width="340" height="72" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D3CCC0" stroke-width="1.5" />
  <rect x="40" y="40" width="4" height="72" fill="#D99300" />
  <text x="56" y="63" fill="#6E6862" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">PROJECT TELEMETRY // SPEC-2026</text>
  <text x="56" y="83" fill="#171513" font-family="sans-serif" font-size="13" font-weight="bold">Dhaka Metro Rail Line 6 Viaduct</text>
  <text x="56" y="100" fill="#D99300" font-family="monospace" font-size="10" font-weight="bold">Transit Infrastructure Corridor</text>

  <!-- 88% VERIFIED Milestone Badge (Bottom-Left) -->
  <rect x="40" y="415" width="230" height="42" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D99300" stroke-width="1.5" />
  <rect x="40" y="415" width="4" height="42" fill="#D99300" />
  <text x="54" y="432" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1">VIADUCT SPAN-04 STATUS</text>
  <text x="54" y="448" fill="#D99300" font-family="monospace" font-size="12" font-weight="extrabold" letter-spacing="0.5">88% VERIFIED</text>

  <!-- Industrial Compass / Scale Marker (Bottom-Right) -->
  <rect x="680" y="420" width="80" height="26" fill="#F4EFE6" stroke="#D3CCC0" stroke-width="1" />
  <text x="720" y="437" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">1:250 CAD SCALE</text>
</svg>
