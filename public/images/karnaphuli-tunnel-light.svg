<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-karnaphuli-tunnel-light" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="50%" stop-color="#EBE5DB" />
      <stop offset="100%" stop-color="#DFD8CC" />
    </linearGradient>
    <linearGradient id="glow-karnaphuli-tunnel-light" x1="200" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D94F05" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-karnaphuli-tunnel-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D3CCC0" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Ground & Foundation Canvas -->
  <rect width="800" height="500" fill="url(#bg-karnaphuli-tunnel-light)" />
  <rect width="800" height="500" fill="url(#grid-karnaphuli-tunnel-light)" opacity="0.4" />
  <rect width="800" height="500" fill="url(#glow-karnaphuli-tunnel-light)" />

  <!-- Riverbed Stratum & Geological Horizon Lines -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#6E6862" stroke-width="2" stroke-dasharray="12 6" />
  <text x="40" y="112" fill="#6E6862" font-family="monospace" font-size="10" font-weight="bold">RIVERBED SILT LAYER // -12m MSL</text>
  
  <line x1="0" y1="380" x2="800" y2="380" stroke="#D3CCC0" stroke-width="2" />
  <line x1="0" y1="384" x2="800" y2="384" stroke="#D94F05" stroke-width="1.2" opacity="0.6" />

  <!-- TBM BORE SECTION GEOMETRY -->

  <!-- Outer Reinforced Segmental Lining Ring -->
  <circle cx="400" cy="265" r="148" fill="#DFD8CC" stroke="#6E6862" stroke-width="6" />
  
  <!-- Segment Joint Radial Dividing Lines (8 precast segments) -->
  <line x1="400" y1="117" x2="400" y2="140" stroke="#3D3935" stroke-width="2.5" />
  <line x1="400" y1="390" x2="400" y2="413" stroke="#3D3935" stroke-width="2.5" />
  <line x1="252" y1="265" x2="275" y2="265" stroke="#3D3935" stroke-width="2.5" />
  <line x1="525" y1="265" x2="548" y2="265" stroke="#3D3935" stroke-width="2.5" />
  <line x1="295" y1="160" x2="312" y2="177" stroke="#3D3935" stroke-width="2" />
  <line x1="505" y1="160" x2="488" y2="177" stroke="#3D3935" stroke-width="2" />
  <line x1="295" y1="370" x2="312" y2="353" stroke="#3D3935" stroke-width="2" />
  <line x1="505" y1="370" x2="488" y2="353" stroke="#3D3935" stroke-width="2" />

  <!-- Waterproof High-Density Polymer Membrane Ring -->
  <circle cx="400" cy="265" r="130" fill="#EBE5DB" stroke="#D94F05" stroke-width="3" />

  <!-- Inner Airflow Void Tunnel Core -->
  <circle cx="400" cy="265" r="118" fill="#F4EFE6" stroke="#D3CCC0" stroke-width="1.5" />

  <!-- Dual-Lane Roadway Deck Slab -->
  <polygon points="288,315 512,315 500,345 300,345" fill="#DFD8CC" stroke="#6E6862" stroke-width="2" />
  <line x1="288" y1="315" x2="512" y2="315" stroke="#3D3935" stroke-width="3.5" />
  <line x1="290" y1="322" x2="510" y2="322" stroke="#D99300" stroke-width="2" stroke-dasharray="10 8" />

  <!-- Drainage & Utility Trench Under Roadway -->
  <rect x="375" y="345" width="50" height="28" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />
  <text x="400" y="363" fill="#6E6862" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">UTILITY DUCT</text>

  <!-- Overhead Jet Fan Ventilation Assembly -->
  <rect x="370" y="152" width="60" height="22" rx="2" fill="#EBE5DB" stroke="#D94F05" stroke-width="1.8" />
  <circle cx="380" cy="163" r="5" fill="#D94F05" />
  <circle cx="420" cy="163" r="5" fill="#D94F05" />
  <line x1="400" y1="135" x2="400" y2="152" stroke="#6E6862" stroke-width="2" />

  <!-- Active DAG Critical Path Indicator Tag (Center Core) -->
  <rect x="300" y="240" width="200" height="48" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D94F05" stroke-width="1.8" />
  <text x="400" y="258" fill="#D94F05" font-family="monospace" font-size="11" font-weight="extrabold" text-anchor="middle" letter-spacing="0.5">TBM BORE // CRITICAL PATH</text>
  <text x="400" y="276" fill="#171513" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">DIA 10.8m · RING #1,842 ADVANCE</text>

  <!-- Telemetry HUD Badge Overlay (Top-Left) -->
  <rect x="40" y="40" width="350" height="72" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D3CCC0" stroke-width="1.5" />
  <rect x="40" y="40" width="4" height="72" fill="#D94F05" />
  <text x="56" y="63" fill="#6E6862" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">PROJECT TELEMETRY // SPEC-2026</text>
  <text x="56" y="83" fill="#171513" font-family="sans-serif" font-size="13" font-weight="bold">Bangabandhu Sub-River Tunnel</text>
  <text x="56" y="100" fill="#D94F05" font-family="monospace" font-size="10" font-weight="bold">Underwater Marine Shield Bore</text>

  <!-- BORE EXCAVATION SCHEDULE // DAG ENGINE Milestone Badge (Bottom-Left) -->
  <rect x="40" y="415" width="280" height="44" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D94F05" stroke-width="1.6" />
  <rect x="40" y="415" width="4" height="44" fill="#D94F05" />
  <text x="54" y="432" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1">BORE EXCAVATION SCHEDULE // DAG ENGINE</text>
  <text x="54" y="449" fill="#D94F05" font-family="monospace" font-size="12" font-weight="extrabold" letter-spacing="0.5">CRITICAL PATH ACTIVE</text>

  <!-- Industrial Compass / Scale Marker (Bottom-Right) -->
  <rect x="670" y="420" width="90" height="26" fill="#F4EFE6" stroke="#D3CCC0" stroke-width="1" />
  <text x="715" y="437" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">1:250 CAD SCALE</text>
</svg>
