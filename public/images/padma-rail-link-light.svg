  <line x1="250" y1="285" x2="250" y2="296" stroke="#6E6862" stroke-width="1.5" />
  <line x1="290" y1="285" x2="290" y2="296" stroke="#6E6862" stroke-width="1.5" />
  <line x1="330" y1="285" x2="330" y2="296" stroke="#6E6862" stroke-width="1.5" />
  <line x1="370" y1="285" x2="370" y2="296" stroke="#6E6862" stroke-width="1.5" />
  <line x1="410" y1="285" x2="410" y2="296" stroke="#6E6862" stroke-width="1.5" />
