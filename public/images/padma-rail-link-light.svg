  <rect x="670" y="425" width="90" height="26" fill="#F4EFE6" stroke="#D3CCC0" stroke-width="1" />
  <text x="715" y="442" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">1:400 CAD SCALE</text>
