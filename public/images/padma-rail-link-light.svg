  <line x1="20" y1="160" x2="780" y2="160" stroke="#D99300" stroke-width="2.5" />
  <line x1="20" y1="168" x2="780" y2="168" stroke="#6E6862" stroke-width="1" stroke-dasharray="8 6" />

