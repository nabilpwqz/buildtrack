  <line x1="610" y1="285" x2="610" y2="296" stroke="#6E6862" stroke-width="1.5" />
  <line x1="650" y1="285" x2="650" y2="296" stroke="#6E6862" stroke-width="1.5" />
  <line x1="690" y1="285" x2="690" y2="296" stroke="#6E6862" stroke-width="1.5" />
  <line x1="730" y1="285" x2="730" y2="296" stroke="#6E6862" stroke-width="1.5" />

