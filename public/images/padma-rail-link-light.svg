  <polygon points="440,270 560,265 560,295 440,290" fill="url(#train-light-beam)" />
  <rect x="340" y="258" width="105" height="24" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1.5" />
  <rect x="345" y="262" width="18" height="9" fill="#F4EFE6" stroke="#6E6862" stroke-width="1" />
