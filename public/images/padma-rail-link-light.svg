  <circle cx="680" cy="175" r="5" fill="#D94F05" stroke="#171513" stroke-width="1.5" />
  <circle cx="230" cy="282" r="5" fill="#D94F05" stroke="#171513" stroke-width="1.5" />
  <circle cx="410" cy="282" r="5" fill="#D94F05" stroke="#171513" stroke-width="1.5" />
  <circle cx="590" cy="282" r="5" fill="#D94F05" stroke="#171513" stroke-width="1.5" />

