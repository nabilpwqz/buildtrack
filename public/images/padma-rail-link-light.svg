  <line x1="140" y1="175" x2="140" y2="282" stroke="#6E6862" stroke-width="2.5" />
  <line x1="230" y1="175" x2="230" y2="282" stroke="#6E6862" stroke-width="2.5" />
  <line x1="320" y1="175" x2="320" y2="282" stroke="#6E6862" stroke-width="2.5" />
  <line x1="410" y1="175" x2="410" y2="282" stroke="#6E6862" stroke-width="2.5" />
  <line x1="500" y1="175" x2="500" y2="282" stroke="#6E6862" stroke-width="2.5" />
