  <line x1="140" y1="130" x2="140" y2="160" stroke="#3D3935" stroke-width="2.5" />
  <line x1="140" y1="130" x2="155" y2="130" stroke="#3D3935" stroke-width="2" />
  <line x1="320" y1="130" x2="320" y2="160" stroke="#3D3935" stroke-width="2.5" />
  <line x1="320" y1="130" x2="335" y2="130" stroke="#3D3935" stroke-width="2" />
  <line x1="500" y1="130" x2="500" y2="160" stroke="#3D3935" stroke-width="2.5" />
  <line x1="500" y1="130" x2="515" y2="130" stroke="#3D3935" stroke-width="2" />
  <line x1="680" y1="130" x2="680" y2="160" stroke="#3D3935" stroke-width="2.5" />
  <line x1="680" y1="130" x2="695" y2="130" stroke="#3D3935" stroke-width="2" />
  <!-- 25kV Catenary Wire -->
  <line x1="20" y1="136" x2="780" y2="136" stroke="#D94F05" stroke-width="1.5" stroke-dasharray="12 4" />

  <!-- ==================== HUD BADGES & STAMPED CAD OVERLAYS ==================== -->

  <!-- Top-Left Telemetry HUD Badge -->
  <rect x="40" y="40" width="365" height="72" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D3CCC0" stroke-width="1.5" />
  <rect x="40" y="40" width="4" height="72" fill="#D99300" />
  <text x="56" y="63" fill="#6E6862" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">PROJECT TELEMETRY // SPEC-2026</text>
  <text x="56" y="83" fill="#171513" font-family="sans-serif" font-size="13" font-weight="bold">Padma Bridge Rail Link Corridor</text>
  <text x="56" y="100" fill="#D99300" font-family="monospace" font-size="10" font-weight="bold">169 km Dual-Gauge Trunk · 41 Warren Truss Spans</text>

  <!-- In-Scene Center-Right Telemetry Tag (EVM Metrics) -->
  <rect x="430" y="38" width="330" height="42" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D94F05" stroke-width="1.5" />
  <rect x="430" y="38" width="4" height="42" fill="#D94F05" />
  <text x="444" y="55" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1">EARNED VALUE AUDIT // CPI: 1.02 (+ $60M)</text>
  <text x="444" y="71" fill="#D94F05" font-family="monospace" font-size="11" font-weight="extrabold" letter-spacing="0.5">EV: $2.87B · BAC: $3.12B · 92% VERIFIED</text>

  <!-- Bottom-Left HEAVY STEEL TRUSS Milestone Badge (User-Requested Part) -->
  <rect x="40" y="415" width="350" height="46" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D99300" stroke-width="1.8" />
  <rect x="40" y="415" width="4" height="46" fill="#D99300" />
  <text x="54" y="433" fill="#6E6862" font-family="monospace" font-size="9.5" font-weight="bold" letter-spacing="1">HEAVY STEEL TRUSS // COST VARIANCE</text>
  <text x="54" y="451" fill="#D99300" font-family="monospace" font-size="12" font-weight="extrabold" letter-spacing="0.5">92% UTILIZATION // ON-SCHEDULE</text>

