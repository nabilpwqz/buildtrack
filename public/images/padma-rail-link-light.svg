<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-padma-rail-link-light" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="50%" stop-color="#EBE5DB" />
      <stop offset="100%" stop-color="#DFD8CC" />
    </linearGradient>
    <linearGradient id="glow-padma-rail-link-light" x1="200" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D94F05" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="river-grad-light" x1="0" y1="360" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFE7EA" />
      <stop offset="100%" stop-color="#C5D2D6" />
    </linearGradient>
    <linearGradient id="train-light-beam" x1="440" y1="270" x2="560" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D99300" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D99300" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-padma-rail-link-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D3CCC0" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Ground Canvas & CAD Grid -->
  <rect width="800" height="500" fill="url(#bg-padma-rail-link-light)" />
  <rect width="800" height="500" fill="url(#grid-padma-rail-link-light)" opacity="0.45" />
  <rect width="800" height="500" fill="url(#glow-padma-rail-link-light)" />

  <!-- River Padma Water Basin -->
  <rect x="0" y="360" width="800" height="140" fill="url(#river-grad-light)" />
  <line x1="0" y1="360" x2="800" y2="360" stroke="#9BB0B8" stroke-width="2" />
  <line x1="40" y1="375" x2="180" y2="375" stroke="#9BB0B8" stroke-width="1.2" stroke-dasharray="14 7" />
  <line x1="240" y1="390" x2="420" y2="390" stroke="#9BB0B8" stroke-width="1.2" stroke-dasharray="20 10" />
  <line x1="500" y1="380" x2="720" y2="380" stroke="#9BB0B8" stroke-width="1.2" stroke-dasharray="16 8" />

  <!-- Riverbed Scour & Silt Strata (Geotechnical Boundary) -->
  <line x1="0" y1="410" x2="800" y2="410" stroke="#6E6862" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="790" y="405" fill="#6E6862" font-family="monospace" font-size="8" font-weight="bold" text-anchor="end">SILT STRATUM // -18.5m BED SCOUR LIMIT</text>

  <!-- ==================== REINFORCED CONCRETE BRIDGE PIERS ==================== -->
  <!-- Left Pylon Pier & Deep Pile Cap -->
  <polygon points="120,310 160,310 170,390 110,390" fill="#DFD8CC" stroke="#6E6862" stroke-width="2" />
  <rect x="95" y="385" width="90" height="22" fill="#D3CCC0" stroke="#3D3935" stroke-width="2" />
  <rect x="128" y="298" width="24" height="12" fill="#3D3935" stroke="#D94F05" stroke-width="1.5" />

  <!-- Center-Right Main Channel Pier & Deep Pile Cap -->
  <polygon points="620,310 660,310 670,390 610,390" fill="#DFD8CC" stroke="#6E6862" stroke-width="2" />
  <rect x="595" y="385" width="90" height="22" fill="#D3CCC0" stroke="#3D3935" stroke-width="2" />
  <rect x="628" y="298" width="24" height="12" fill="#3D3935" stroke="#D94F05" stroke-width="1.5" />

