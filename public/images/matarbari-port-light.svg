<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-matarbari-port-light" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="50%" stop-color="#EBE5DB" />
      <stop offset="100%" stop-color="#DFD8CC" />
    </linearGradient>
    <linearGradient id="glow-matarbari-port-light" x1="200" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D94F05" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="water-grad-light" x1="0" y1="330" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFE7EA" />
      <stop offset="100%" stop-color="#C5D2D6" />
    </linearGradient>
    <pattern id="grid-matarbari-port-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D3CCC0" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Ground Canvas & CAD Grid -->
  <rect width="800" height="500" fill="url(#bg-matarbari-port-light)" />
  <rect width="800" height="500" fill="url(#grid-matarbari-port-light)" opacity="0.45" />
  <rect width="800" height="500" fill="url(#glow-matarbari-port-light)" />

  <!-- Harbor Basin Water Body -->
  <rect x="0" y="340" width="800" height="160" fill="url(#water-grad-light)" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#9BB0B8" stroke-width="2" />
  
  <!-- Waterline Wavelets & Reflections -->
  <line x1="40" y1="355" x2="160" y2="355" stroke="#9BB0B8" stroke-width="1.2" stroke-dasharray="16 8" />
  <line x1="220" y1="370" x2="380" y2="370" stroke="#9BB0B8" stroke-width="1.2" stroke-dasharray="24 12" />
  <line x1="450" y1="360" x2="620" y2="360" stroke="#9BB0B8" stroke-width="1.2" stroke-dasharray="20 10" />
  <line x1="680" y1="375" x2="780" y2="375" stroke="#9BB0B8" stroke-width="1.2" stroke-dasharray="12 6" />

  <!-- Marine Breakwater Quay Wall & Berthing Platform -->
  <polygon points="0,290 800,290 800,340 0,340" fill="#DFD8CC" stroke="#6E6862" stroke-width="2" />
  <!-- Quay Edge Safety Coping & Crane Rails -->
  <line x1="0" y1="290" x2="800" y2="290" stroke="#D99300" stroke-width="3" />
  <line x1="0" y1="298" x2="800" y2="298" stroke="#3D3935" stroke-width="2" stroke-dasharray="8 4" />
  <line x1="0" y1="332" x2="800" y2="332" stroke="#6E6862" stroke-width="1.5" />

  <!-- Heavy Rubber Fenders on Berth Edge -->
  <rect x="70" y="338" width="24" height="14" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1" />
  <rect x="180" y="338" width="24" height="14" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1" />
  <rect x="290" y="338" width="24" height="14" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1" />
  <rect x="400" y="338" width="24" height="14" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1" />
  <rect x="510" y="338" width="24" height="14" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1" />
  <rect x="620" y="338" width="24" height="14" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1" />
  <rect x="730" y="338" width="24" height="14" rx="2" fill="#3D3935" stroke="#171513" stroke-width="1" />

  <!-- Precast Concrete Tetrapod Breakwater Armoring (Shore Protection) -->
  <polygon points="20,380 35,350 50,380 35,395" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />
  <polygon points="45,390 60,360 75,390 60,405" fill="#C9C3BB" stroke="#6E6862" stroke-width="1.5" />
  <polygon points="70,380 85,350 100,380 85,395" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.5" />

  <!-- ==================== MARITIME AGGREGATE STORAGE BAYS ==================== -->
  <!-- Storage Bay Retaining Walls (Reinforced Concrete Partitions) -->
  <polygon points="230,290 245,190 255,190 240,290" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.8" />
  <polygon points="360,290 375,190 385,190 370,290" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.8" />
  <polygon points="490,290 505,190 515,190 500,290" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.8" />

  <!-- Bay 1: Coarse Crushed Granite Mound (20mm - 40mm) -->
  <polygon points="242,290 305,205 368,290" fill="#C9C3BB" stroke="#6E6862" stroke-width="1.5" />
  <line x1="260" y1="270" x2="350" y2="270" stroke="#6E6862" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="280" y1="245" x2="330" y2="245" stroke="#6E6862" stroke-width="1" stroke-dasharray="3 3" />
  <text x="305" y="282" fill="#171513" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">CRUSHED GRANITE 20MM</text>

  <!-- Bay 2: Washed Silica Sand & Fine Aggregates -->
  <polygon points="372,290 435,215 498,290" fill="#DFD0B8" stroke="#B8920C" stroke-width="1.5" />
  <line x1="390" y1="270" x2="480" y2="270" stroke="#B8920C" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="410" y1="245" x2="460" y2="245" stroke="#B8920C" stroke-width="1" stroke-dasharray="3 3" />
  <text x="435" y="282" fill="#171513" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">WASHED SILICA SAND</text>

  <!-- Overhead Aggregate Conveyor Truss -->
  <line x1="220" y1="175" x2="530" y2="175" stroke="#3D3935" stroke-width="3" />
  <line x1="220" y1="185" x2="530" y2="185" stroke="#6E6862" stroke-width="2" />
  <line x1="240" y1="175" x2="250" y2="185" stroke="#6E6862" stroke-width="1" />
  <line x1="260" y1="185" x2="270" y2="175" stroke="#6E6862" stroke-width="1" />
  <line x1="280" y1="175" x2="290" y2="185" stroke="#6E6862" stroke-width="1" />
  <line x1="300" y1="185" x2="310" y2="175" stroke="#6E6862" stroke-width="1" />
  <line x1="320" y1="175" x2="330" y2="185" stroke="#6E6862" stroke-width="1" />
  <line x1="340" y1="185" x2="350" y2="175" stroke="#6E6862" stroke-width="1" />
  <line x1="360" y1="175" x2="370" y2="185" stroke="#6E6862" stroke-width="1" />
  <line x1="380" y1="185" x2="390" y2="175" stroke="#6E6862" stroke-width="1" />
  <line x1="400" y1="175" x2="410" y2="185" stroke="#6E6862" stroke-width="1" />
  <line x1="420" y1="185" x2="430" y2="175" stroke="#6E6862" stroke-width="1" />
  <line x1="440" y1="175" x2="450" y2="185" stroke="#6E6862" stroke-width="1" />
  <line x1="460" y1="185" x2="470" y2="175" stroke="#6E6862" stroke-width="1" />
  <line x1="480" y1="175" x2="490" y2="185" stroke="#6E6862" stroke-width="1" />
  <line x1="500" y1="185" x2="510" y2="175" stroke="#6E6862" stroke-width="1" />

  <!-- ==================== REBAR STOCK & CAGE FABRICATION YARD ==================== -->
  <!-- Rebar Timber Dunnage Footings -->
  <rect x="50" y="280" width="150" height="10" fill="#D3CCC0" stroke="#6E6862" stroke-width="1.2" />
  <!-- Bundled High-Tensile Steel Rebar Rods -->
  <line x1="50" y1="272" x2="195" y2="272" stroke="#171513" stroke-width="2.5" />
  <line x1="50" y1="264" x2="195" y2="264" stroke="#3D3935" stroke-width="2.5" />
  <line x1="55" y1="256" x2="190" y2="256" stroke="#171513" stroke-width="2.5" />
  <line x1="60" y1="248" x2="185" y2="248" stroke="#3D3935" stroke-width="2.5" />
  <line x1="65" y1="240" x2="180" y2="240" stroke="#171513" stroke-width="2.5" />
  <!-- Molten Amber Rebar Tie Straps / Slings -->
  <rect x="80" y="238" width="6" height="44" fill="#D94F05" />
  <rect x="120" y="238" width="6" height="44" fill="#D94F05" />
  <rect x="160" y="238" width="6" height="44" fill="#D94F05" />

  <!-- Prefabricated Circular Rebar Cage (Bored Pile Reinforcement) -->
  <circle cx="110" cy="195" r="28" fill="none" stroke="#6E6862" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="110" cy="195" r="24" fill="none" stroke="#D99300" stroke-width="1.5" />
  <circle cx="110" cy="195" r="2" fill="#D94F05" />
  <!-- Longitudinal Main Bars -->
  <circle cx="110" cy="171" r="2.5" fill="#171513" />
  <circle cx="134" cy="195" r="2.5" fill="#171513" />
  <circle cx="110" cy="219" r="2.5" fill="#171513" />
  <circle cx="86" cy="195" r="2.5" fill="#171513" />
  <circle cx="127" cy="178" r="2.5" fill="#171513" />
  <circle cx="127" cy="212" r="2.5" fill="#171513" />
  <circle cx="93" cy="212" r="2.5" fill="#171513" />
  <circle cx="93" cy="178" r="2.5" fill="#171513" />
  <text x="110" y="152" fill="#6E6862" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">500W REBAR CAGE DIA 1.5m</text>

  <!-- ==================== RAIL-MOUNTED GANTRY CRANE (RMG) ==================== -->
  <!-- Crane Gantry Legs (Left & Right A-Frames) -->
  <polygon points="560,290 575,100 585,100 572,290" fill="#DFD8CC" stroke="#3D3935" stroke-width="2" />
  <polygon points="720,290 705,100 695,100 708,290" fill="#DFD8CC" stroke="#3D3935" stroke-width="2" />
  <line x1="565" y1="200" x2="715" y2="200" stroke="#D94F05" stroke-width="2.5" />
  <line x1="570" y1="200" x2="700" y2="100" stroke="#6E6862" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="710" y1="200" x2="580" y2="100" stroke="#6E6862" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Horizontal Double Box Boom & Trolley Rail -->
  <rect x="540" y="85" width="205" height="18" fill="#EBE5DB" stroke="#D94F05" stroke-width="2.5" />
  <line x1="540" y1="94" x2="745" y2="94" stroke="#3D3935" stroke-width="1.5" />

  <!-- Crane Trolley & Clamshell Material Bucket -->
  <rect x="625" y="78" width="35" height="14" fill="#3D3935" stroke="#D94F05" stroke-width="1.5" />
  <line x1="635" y1="103" x2="635" y2="160" stroke="#6E6862" stroke-width="1.5" stroke-dasharray="3 2" />
  <line x1="650" y1="103" x2="650" y2="160" stroke="#6E6862" stroke-width="1.5" stroke-dasharray="3 2" />
  <!-- Clamshell Bucket Assembly -->
  <polygon points="626,160 658,160 652,185 632,185" fill="#D94F05" stroke="#3D3935" stroke-width="1.5" />
  <line x1="642" y1="160" x2="642" y2="185" stroke="#171513" stroke-width="1.5" />

  <!-- Crane Operator Cab & Machinery House -->
  <rect x="670" y="65" width="45" height="20" fill="#F4EFE6" stroke="#3D3935" stroke-width="1.5" />
  <rect x="675" y="70" width="16" height="10" fill="#DFE7EA" stroke="#6E6862" stroke-width="1" />
  <circle cx="705" cy="62" r="3" fill="#D94F05" />

  <!-- ==================== HUD BADGES & STAMPED CAD OVERLAYS ==================== -->

  <!-- Top-Left Telemetry HUD Badge -->
  <rect x="40" y="40" width="350" height="72" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D3CCC0" stroke-width="1.5" />
  <rect x="40" y="40" width="4" height="72" fill="#D94F05" />
  <text x="56" y="63" fill="#6E6862" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">PROJECT TELEMETRY // SPEC-2026</text>
  <text x="56" y="83" fill="#171513" font-family="sans-serif" font-size="13" font-weight="bold">Matarbari Deep Sea Port</text>
  <text x="56" y="100" fill="#D94F05" font-family="monospace" font-size="10" font-weight="bold">Deep Sea Maritime Terminal &amp; Material Depot</text>

  <!-- In-Scene Center-Right Stockpile Telemetry Tag -->
  <rect x="440" y="38" width="310" height="42" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D99300" stroke-width="1.5" />
  <rect x="440" y="38" width="4" height="42" fill="#D99300" />
  <text x="454" y="55" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1">BULK AGGREGATE SILOS &amp; REBAR YARD</text>
  <text x="454" y="71" fill="#D99300" font-family="monospace" font-size="11" font-weight="extrabold" letter-spacing="0.5">ON-HAND: 118,400 MT · 64% COMMISSIONED</text>

  <!-- Bottom-Left MARITIME AGGREGATES & REBAR STOCK Milestone Badge (User-Requested Part) -->
  <rect x="40" y="415" width="330" height="46" rx="2" fill="#F4EFE6" fill-opacity="0.95" stroke="#D94F05" stroke-width="1.8" />
  <rect x="40" y="415" width="4" height="46" fill="#D94F05" />
  <text x="54" y="433" fill="#6E6862" font-family="monospace" font-size="9.5" font-weight="bold" letter-spacing="1">MARITIME AGGREGATES &amp; REBAR STOCK</text>
  <text x="54" y="451" fill="#D94F05" font-family="monospace" font-size="12" font-weight="extrabold" letter-spacing="0.5">ZERO OVER-ISSUE // TRANSACTION SAFE</text>

  <!-- Bottom-Right Industrial Compass / Scale Marker -->
  <rect x="670" y="425" width="90" height="26" fill="#F4EFE6" stroke="#D3CCC0" stroke-width="1" />
  <text x="715" y="442" fill="#6E6862" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">1:500 CAD SCALE</text>
</svg>